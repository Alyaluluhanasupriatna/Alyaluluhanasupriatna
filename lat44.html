
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penilaian Huruf Mutu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 40px auto;
            padding: 20px;
            background-color: #FADADD;
        }

        .container {
            background-color: #FFF0F5;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.2);
        }

        h2 {
            text-align: center;
            color: #D46A91;
            font-size: 27px;
        }

        label {
            display: block;
            margin-top: 18px;
            color: #A64D79;
            font-size: 16px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 8px;
            border: 2px solid #F4A6C1;
            border-radius: 10px;
            background-color: white;
            color: #A64D79;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background-color: #EFA4BD;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #D46A91;
        }

        #hasil {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            line-height: 1.8;
            display: none;
        }

        .A {
            background-color: #F8C8DC;
            color: #A64D79;
        }

        .B {
            background-color: #FADADD;
            color: #A64D79;
        }

        .C {
            background-color: #FFE4E1;
            color: #B05B78;
        }

        .D {
            background-color: #FCE1E4;
            color: #B45A70;
        }

        .E {
            background-color: #F8D7DA;
            color: #A94455;
        }

        .error {
            background-color: #F8D7DA;
            color: #A94455;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>♡ Penilaian Huruf Mutu ♡</h2>

        <label for="nama">Nama:</label>
        <input type="text" id="nama"
               placeholder="Masukkan nama">

        <label for="nilai">Nilai akhir (0–100):</label>
        <input type="number" id="nilai"
               placeholder="Masukkan nilai akhir"
               oninput="resetHasil()">

        <button onclick="hitungNilai()">
            Hitung Huruf Mutu
        </button>

        <div id="hasil"></div>

    </div>

    <script>
        function resetHasil() {
            const hasil = document.getElementById("hasil");
            hasil.style.display = "none";
            hasil.className = "";
            hasil.textContent = "";
        }

        function hitungNilai() {
            const nama = document.getElementById("nama").value.trim();
            const inputNilai = document.getElementById("nilai").value;
            const hasil = document.getElementById("hasil");

            hasil.style.display = "block";
            hasil.className = "";

            // Validasi nama
            if (nama === "") {
                hasil.classList.add("error");
                hasil.textContent = "Error: Nama harus diisi!";
                return;
            }

            // Validasi input kosong atau bukan angka
            if (inputNilai.trim() === "" ||
                !Number.isFinite(Number(inputNilai))) {
                hasil.classList.add("error");
                hasil.textContent = "Error: Nilai harus berupa angka!";
                return;
            }

            const nilai = Number(inputNilai);

            // Validasi nilai negatif
            if (nilai < 0) {
                hasil.classList.add("error");
                hasil.textContent =
                    "Error: Nilai tidak boleh negatif!";
                return;
            }

            // Validasi nilai lebih dari 100
            if (nilai > 100) {
                hasil.classList.add("error");
                hasil.textContent =
                    "Error: Nilai tidak boleh melebihi 100!";
                return;
            }

            let huruf;

            if (nilai < 49.5) {
                huruf = "E";
            } else if (nilai < 59.5) {
                huruf = "D";
            } else if (nilai < 74.5) {
                huruf = "C";
            } else if (nilai < 84.5) {
                huruf = "B";
            } else {
                huruf = "A";
            }

            // Menampilkan hasil penilaian
            hasil.classList.add(huruf);

            hasil.innerHTML =
                "♡ Nama: " + nama +
                "<br>Nilai akhir: " + nilai +
                "<br>Huruf mutu: <strong>" + huruf + "</strong> ♡";
        }
    </script>

</body>
</html>
