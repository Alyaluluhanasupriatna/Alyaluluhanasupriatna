
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waktu Saat Ini</title>
</head>
<body>

    <button onclick="tampilkanWaktu()">
        Tampilkan Waktu saat ini
    </button>

    <script>
        /*
        PSEUDOCODE:
        1. Mulai
        2. Buat fungsi tampilkanWaktu
        3. Ambil tanggal dan waktu saat ini
        4. Tampilkan tanggal dan waktu menggunakan alert
        5. Selesai
        */

        // Implementasi JavaScript sebenarnya
        function tampilkanWaktu() {
            let sekarang = new Date();
            alert(sekarang.toLocaleString("id-ID"));
        }
    </script>

</body>
</html>
