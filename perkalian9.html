
<!DOCTYPE html>
<html lang="id">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perkalian 9</title>
</head>
<body>

    <h2>Tabel Perkalian 9</h2>

    <ul>
        <li>Nama: Alya Luluhana Supriatna</li>
        <li>NIM: 262302012</li>
        <li>Prodi: Komputerisasi Akuntansi</li>
        <li>Semester: 1</li>
    </ul>

    <h3>Hasil Perkalian:</h3>

    <div id="hasil"></div>

    <script>
        let bilangan = 9;
        let hasil = "";

        for (let i = 1; i <= 20; i++) {
            hasil += "Angka ke " + i + ": " +
            bilangan + " x " + i + " = " +
            (bilangan * i) + "<br>";
        }

        document.getElementById("hasil").innerHTML = hasil;
    </script>
