<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Alya Luluhana Supriatna</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <!-- Card Biodata -->
                <div class="card shadow border-0 rounded-4">
                    
                    <div class="card-body text-center p-4">

                        <!-- Foto -->
                        <div class="mb-3">
                            <div class="bg-primary text-white rounded-circle d-flex 
                                        align-items-center justify-content-center mx-auto"
                                 style="width: 100px; height: 100px;">
                                <span class="fs-1 fw-bold">A</span>
                            </div>
                        </div>

                        <!-- Judul -->
                        <h2 class="fw-bold mb-1">Biodata Mahasiswa</h2>
                        <p class="text-muted mb-4">
                            Komputerisasi Akuntansi
                        </p>

                        <!-- Data Biodata -->
                        <div class="text-start">

                            <div class="row border-bottom py-3">
                                <div class="col-5 fw-bold">Nama</div>
                                <div class="col-7">
                                    Alya Luluhana Supriatna
                                </div>
                            </div>

                            <div class="row border-bottom py-3">
                                <div class="col-5 fw-bold">Kelas</div>
                                <div class="col-7">
                                    Komputerisasi Akuntansi
                                </div>
                            </div>

                            <div class="row py-3">
                                <div class="col-5 fw-bold">Semester</div>
                                <div class="col-7">
                                    1
                                </div>
                            </div>

                        </div>

                        <!-- Badge -->
                        <div class="mt-4">
                            <span class="badge bg-primary rounded-pill px-3 py-2">
                                Mahasiswa Semester 1
                            </span>
                        </div>

                    </div>
                </div>

                <!-- Footer -->
                <p class="text-center text-muted mt-4 small">
                    © 2026 Alya Luluhana Supriatna
                </p>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
